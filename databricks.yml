bundle:
  name: testing-sp

workspace:
  host: https://adb-7405616448924818.18.azuredatabricks.net

targets:
  dev:
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    testing_sp_compute:
      name: "Testing SP Compute"
      job_clusters:
        - job_cluster_key: compute_cluster
          new_cluster:
            spark_version: "17.3.x-scala2.13"
            node_type_id: Standard_D4ds_v5
            num_workers: 1
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
      tasks:
        - task_key: compute_port
          description: >
            Computes the MEIO target delta report from the supply_chain_oracle_raw
            band quantity port using Delta time travel for the previous snapshot.
          job_cluster_key: compute_cluster
          spark_python_task:
            python_file: ${workspace.file_path}/src/meio_target_report/compute_port.py
            source: WORKSPACE
            parameters:
              - "--input-contract"
